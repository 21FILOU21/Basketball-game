name: Test NBA data sync

on:
  push:
    branches: ["main", "feature/automatic-nba-data-sync"]
  pull_request:
    branches: ["main"]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
